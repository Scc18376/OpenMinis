name: Build iOS 14.3 IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install meson ninja llvm lld libarchive pkg-config go
          mkdir -p logs
      - name: Apply existing iOS 14.3 migration
        run: |
          set -euo pipefail
          if [ -f ios14-migration.patch ]; then
            git apply --check ios14-migration.patch
            git apply -v ios14-migration.patch
          else
            test -f src/ios/Compat/CompatCore.swift
            test -f src/ios/Compat/CompatViews.swift
            echo "Migration is already committed in the source tree"
          fi
          grep -o 'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*' src/ios/Minis.xcodeproj/project.pbxproj | sort -u
          cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig
      - name: Typecheck iOS 14.3 compatibility layer
        run: |
          set -o pipefail
          xcrun swiftc -typecheck -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios14.3 -swift-version 5 src/ios/Compat/CompatCore.swift src/ios/Compat/CompatViews.swift 2>&1 | tee logs/compat.log
      - uses: actions/cache/restore@v4
        id: media-cache
        with:
          path: |
            deps/frameworks
            deps/lame-build
          key: ios14-media-intel-sdk18-v1
      - name: LAME
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: set -o pipefail; bash deps/build_lame.sh 2>&1 | tee logs/lame.log
      - name: FFmpeg
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          if [ ! -d deps/ffmpeg-6.1.2 ]; then
            curl -fL --retry 3 --connect-timeout 20 --max-time 180 https://codeload.github.com/FFmpeg/FFmpeg/tar.gz/refs/tags/n6.1.2 -o /tmp/ffmpeg-source.tar.gz
            mkdir -p deps/ffmpeg-6.1.2
            tar -xzf /tmp/ffmpeg-source.tar.gz --strip-components=1 -C deps/ffmpeg-6.1.2
          fi
          bash deps/build_ffmpeg.sh 2>&1 | tee logs/ffmpeg.log
      - uses: actions/cache/save@v4
        if: steps.media-cache.outputs.cache-hit != 'true'
        with:
          path: |
            deps/frameworks
            deps/lame-build
          key: ios14-media-intel-sdk18-v1
      - name: iSH
        run: set -o pipefail; bash deps/build_ish.sh 2>&1 | tee logs/ish.log
      - name: Alpine rootfs
        run: |
          set -euo pipefail
          # Only the host-side archive converter uses this configuration.
          # The device emulator and Alpine rootfs remain ARM64.
          sed -i '' 's/-Dguest_arch=arm64/-Dguest_arch=x86/g' deps/prepare_alpine_rootfs.sh
          bash deps/prepare_alpine_rootfs.sh 2>&1 | tee logs/rootfs.log
      - name: Rclone
        run: |
          set -euo pipefail
          sed -i '' 's/version-min=16.0/version-min=14.3/g' deps/build_rclone_ios.sh
          bash deps/build_rclone_ios.sh 2>&1 | tee logs/rclone.log
      - name: Build original Minis for iOS 14.3
        run: |
          set -o pipefail
          xcodebuild -project src/ios/Minis.xcodeproj -scheme Minis -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" IPHONEOS_DEPLOYMENT_TARGET=14.3 ARCHS=arm64 ONLY_ACTIVE_ARCH=NO ENABLE_BITCODE=NO build 2>&1 | tee logs/build.log
      - name: Package and verify unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -a build/Build/Products/Release-iphoneos/Minis.app Payload/
          chmod 755 Payload/Minis.app/Minis
          xcrun vtool -show-build Payload/Minis.app/Minis | tee logs/macho.txt
          zip -qry Minis-iOS14.3-unsigned.ipa Payload
          python3 - <<'PY'
          import plistlib, zipfile
          with zipfile.ZipFile('Minis-iOS14.3-unsigned.ipa') as z:
              info = z.getinfo('Payload/Minis.app/Minis')
              assert (info.external_attr >> 16) & 0o777 == 0o755
              for name in z.namelist():
                  if name.endswith('.app/Info.plist') or name.endswith('.appex/Info.plist'):
                      p = plistlib.loads(z.read(name))
                      version = tuple(map(int, p['MinimumOSVersion'].split('.')))
                      assert version <= (14, 3), (name, version)
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Minis-iOS14.3-unsigned
          path: Minis-iOS14.3-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: logs/
          if-no-files-found: warn
